<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keir responsive checks</title>
<style>
 body{margin:24px;background:#e7eae4;color:#111b1f;font:16px/1.5 system-ui,sans-serif}
 a{color:#205b50}button{font:inherit;padding:10px 18px}pre{white-space:pre-wrap}
 #frames{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
 iframe{display:block;border:0;background:#111b1f}h2{font-size:18px}
 .fail{color:#a52b13}.pass{color:#205b50}
</style>
<h1>Keir responsive checks</h1>
<p>No dependencies. Serve the repository over HTTP, then open this page.</p>
<p>Visual review:
 <a href="?review=320">320px</a> · <a href="?review=390">390px</a> ·
 <a href="?review=430">430px</a> · <a href="?review=844">844px landscape</a> ·
 <a href="?review=932">932px landscape</a> · <a href="?review=1440">Desktop</a>.
 Portrait review panels expand to show all content. Landscape panels show the fitted slide.
</p>
<button id="run">Run checks</button>
<pre id="results" role="status">Ready.</pre>
<div id="frames"></div>
<script>
const frames=document.getElementById('frames'),results=document.getElementById('results');
const ready=win=>new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
async function load(width,height,slide=1,container=frames){
 const frame=document.createElement('iframe');
 frame.width=width;frame.height=height;frame.allowFullscreen=true;frame.title=`${width}px · slide ${slide}`;
 const loaded=new Promise(resolve=>frame.onload=resolve);
 frame.src=`../index.html#${slide}`;container.append(frame);await loaded;
 await frame.contentDocument.fonts.ready;await ready(frame.contentWindow);
 return frame;
}
document.getElementById('run').onclick=async()=>{
  frames.replaceChildren();delete document.body.dataset.done;results.textContent='Running…';
 const failures=[];let checks=0;
 const check=(ok,message)=>{checks++;if(!ok)failures.push(message)};
 try{
   for(const width of [320,390,430]){
    const height=844,frame=await load(width,height);
   const win=frame.contentWindow,doc=frame.contentDocument,stage=doc.getElementById('stage'),controls=doc.getElementById('controls'),counter=doc.getElementById('slide-count');
   check(controls.hidden,'Phone controls start hidden');
   check(counter.textContent==='1/13'&&counter.getBoundingClientRect().width>=44,'Persistent counter starts at 1/13 and is tappable');
   const hint=doc.getElementById('portrait-hint'),hintRect=hint.getBoundingClientRect();
   check(win.getComputedStyle(hint).display!=='none'&&hint.textContent.includes('landscape'),'Portrait suggests trying landscape');
   check(hintRect.left>=0&&hintRect.bottom<=height&&hintRect.right<=counter.getBoundingClientRect().left-8,'Portrait hint fits beside the counter');
   doc.querySelector('.brand').click();check(!controls.hidden,'Tapping a slide reveals controls');
   check(hint.getBoundingClientRect().bottom<=controls.getBoundingClientRect().top,'Portrait hint stays clear of revealed controls');
   doc.getElementById('next').focus();doc.querySelector('.brand').click();check(controls.hidden&&doc.activeElement===counter,'Hiding controls moves keyboard focus to the visible counter');
   counter.click();check(!controls.hidden&&counter.getAttribute('aria-expanded')==='true','Counter can reveal controls');
   for(let slide=1;slide<=13;slide++){
    if(slide>1)doc.getElementById('next').click();
    await ready(win);
    const panel=doc.querySelector('.slide.active');
     check(win.location.hash===`#${slide}`,`${width}px: slide ${slide} navigation`);
     check(counter.textContent===`${slide}/13`,`${width}px: slide ${slide} persistent counter`);
    check(panel.scrollWidth<=panel.clientWidth+1,`${width}px: slide ${slide} horizontal overflow`);
    for(const el of panel.querySelectorAll('*')){
     if(el.closest('svg,pre'))continue;
     const r=el.getBoundingClientRect();
     if(!r.width||!r.height)continue;
     check(r.left>=-1&&r.right<=width+1,`${width}px: slide ${slide} clipped ${el.className||el.tagName}`);
    }
    const heading=panel.querySelector('h1,h2');
    check(parseFloat(win.getComputedStyle(heading).fontSize)>=30,`${width}px: slide ${slide} heading too small`);
    for(const p of panel.querySelectorAll('p')){
     if(p.getBoundingClientRect().height)check(parseFloat(win.getComputedStyle(p).fontSize)>=16,`${width}px: slide ${slide} body text too small`);
    }
    panel.scrollTop=panel.scrollHeight;
    check(panel.scrollTop+panel.clientHeight>=panel.scrollHeight-1,`${width}px: slide ${slide} bottom unreachable`);
   }
   for(const button of doc.querySelectorAll('#controls button')){
    if(button.hidden)continue;
    const r=button.getBoundingClientRect();
    check(r.width>=44&&r.height>=44&&r.left>=0&&r.right<=width,`${width}px: navigation tap target`);
   }
   const key=(key,extra={})=>doc.body.dispatchEvent(new win.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true,...extra}));
   key('Home');await ready(win);
   check(win.location.hash==='#1','Home returns to slide 1');
   key('PageDown');check(doc.querySelector('.slide.active').scrollTop>0,'PageDown scrolls the phone slide');
   check(win.location.hash==='#1','PageDown does not change slides');
   key('ArrowRight');key('ArrowLeft');
   check(doc.querySelector('.slide.active').scrollTop===0,'Revisited slide starts at top');
   const touch=(name,x,y,target=stage,count=1)=>{const points=Array.from({length:count},(_,i)=>new win.Touch({identifier:i,target,clientX:x+i*20,clientY:y,screenX:x+i*20,screenY:y}));return target.dispatchEvent(new win.TouchEvent(name,{bubbles:true,cancelable:true,touches:name==='touchend'||name==='touchcancel'?[]:points,changedTouches:points}))};
   touch('touchstart',250,600);check(touch('touchmove',180,300),'Vertical reading gestures keep native scrolling');touch('touchend',100,100);
   check(win.location.hash==='#1','Diagonal reading gesture does not navigate');
   touch('touchstart',250,300);check(!touch('touchmove',130,305),'Slide swipes prevent native horizontal browser gestures');touch('touchend',30,310);
   check(win.location.hash==='#2'&&counter.textContent==='2/13'&&controls.hidden,'Swipe left advances a slide, updates the counter and hides controls');
   stage.click();check(controls.hidden,'A swipe-generated click does not reopen controls');
   touch('touchstart',200,200);touch('touchend',200,200);stage.click();check(!controls.hidden,'A deliberate tap immediately after a swipe reveals controls');
   touch('touchstart',200,200);touch('touchend',200,200);stage.click();check(controls.hidden,'A second deliberate tap hides controls');
   touch('touchstart',30,300);touch('touchmove',150,305);touch('touchend',250,310);
   check(win.location.hash==='#1','Swipe right returns to the previous slide');
   touch('touchstart',250,600);touch('touchmove',245,540);touch('touchend',30,490);
   check(win.location.hash==='#1','A gesture that starts vertically stays a reading gesture');
   touch('touchstart',100,300);touch('touchend',135,302);
   check(win.location.hash==='#1','Short gestures do not navigate');
   touch('touchstart',250,300);touch('touchcancel',130,300);touch('touchend',30,300);
   check(win.location.hash==='#1','Cancelled gestures do not navigate');
   touch('touchstart',250,300,stage,2);touch('touchend',30,300);
   check(win.location.hash==='#1','Multi-touch gestures do not navigate');
   touch('touchstart',30,300);touch('touchend',250,300);
   check(win.location.hash==='#1','Swiping before the first slide stays at 1/13');
   key('End');touch('touchstart',250,300);touch('touchend',30,300);
   check(win.location.hash==='#13'&&counter.textContent==='13/13','Swiping after the last slide stays at 13/13');
   const link=doc.querySelector('.slide.active .fin-note');link.addEventListener('click',event=>event.preventDefault(),{once:true});link.click();
   check(controls.hidden&&link.href==='https://github.com/rore/keir-core','The repository link stays intact and does not toggle controls');
   key('Home');counter.click();
   const overviewButton=doc.getElementById('ov-btn');overviewButton.focus();overviewButton.click();await ready(win);
   const overview=doc.getElementById('overview'),close=doc.getElementById('ov-close');
   check(overview.classList.contains('open')&&stage.inert&&counter.inert,'Overview opens and makes the deck and counter inert');
   check(overview.scrollWidth<=overview.clientWidth+1,'Overview fits narrow phones');
   overview.scrollTop=overview.scrollHeight;await ready(win);
   const closeRect=close.getBoundingClientRect();
   check(closeRect.top>=0&&closeRect.bottom<=height,'Overview close remains visible at the bottom');
   close.focus();key('Tab',{shiftKey:true});
   check(doc.activeElement===doc.querySelector('#ov-grid button:last-child'),'Overview focus wraps backwards');
   key('Tab');check(doc.activeElement===close,'Overview focus wraps forwards');
   key('Escape');check(!overview.classList.contains('open')&&doc.activeElement===overviewButton,'Escape closes overview and restores focus');
   doc.activeElement.blur();key('o');key('Escape');
   check(doc.activeElement===counter,'Overview opened from the page restores usable keyboard focus');
   overviewButton.click();doc.querySelectorAll('#ov-grid button')[9].click();
   check(win.location.hash==='#10'&&!overview.classList.contains('open'),'Overview selects a slide');
   const pre=doc.querySelector('.slide.active pre');
   pre.scrollLeft=pre.scrollWidth;
   check(pre.scrollWidth<=pre.clientWidth||pre.scrollLeft>0,'Long code lines can scroll sideways');
   touch('touchstart',250,300,pre);touch('touchmove',130,300,pre);touch('touchend',30,300,pre);
   check(win.location.hash==='#10','Horizontal code gestures do not change slides');
   const controlsBeforeCodeTap=controls.hidden;pre.click();check(controls.hidden===controlsBeforeCodeTap,'Tapping code does not toggle controls');
   pre.focus();pre.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));
    check(win.location.hash==='#10','Code arrow keys do not change slides');
    doc.querySelector('.slide.active').scrollTop=200;
    frame.width=844;frame.height=390;await ready(win);
    const rotatedStage=stage.getBoundingClientRect(),rotatedPanel=doc.querySelector('.slide.active');
    check(win.location.hash==='#10','Rotation keeps the current slide');
    check(rotatedPanel.scrollTop===0,'Rotation clears the portrait scroll offset');
     check(rotatedStage.left>=-1&&rotatedStage.right<=844+1&&rotatedStage.top>=-1&&rotatedStage.bottom<=390+1,'Rotated slide fits the full viewport');
     check(rotatedPanel.scrollHeight<=rotatedPanel.clientHeight+1,'Rotated slide needs no vertical scrolling');
     const viewport=win.visualViewport,descriptors=new Map(['width','height','scale'].map(name=>[name,Object.getOwnPropertyDescriptor(viewport,name)]));
     const zoom={width:viewport.width/2,height:viewport.height/2,scale:viewport.scale*2},beforeZoom=stage.getBoundingClientRect(),controlsBeforeZoom=controls.hidden;
     for(const [name,value] of Object.entries(zoom))Object.defineProperty(viewport,name,{configurable:true,value});
     viewport.dispatchEvent(new win.Event('resize'));await ready(win);
     const zoomed=stage.getBoundingClientRect();
     check(Math.abs(zoomed.width-beforeZoom.width)<1&&Math.abs(zoomed.height-beforeZoom.height)<1,'Pinch zoom does not shrink the underlying slide to cancel magnification');
     touch('touchstart',250,200);check(touch('touchmove',130,200),'Zoomed one-finger panning keeps native browser behavior');touch('touchend',30,200);stage.click();
     check(win.location.hash==='#10'&&controls.hidden===controlsBeforeZoom,'Zoomed panning neither changes slides nor toggles controls');
     for(const [name,descriptor] of descriptors){if(descriptor)Object.defineProperty(viewport,name,descriptor);else delete viewport[name]}
     viewport.dispatchEvent(new win.Event('resize'));await ready(win);
     touch('touchstart',250,200);touch('touchmove',130,200);touch('touchend',30,200);
     check(win.location.hash==='#11','Zooming back out restores slide swipes');doc.getElementById('prev').click();
     const fullscreenDescriptor=Object.getOwnPropertyDescriptor(doc,'fullscreenElement'),canvasViewport=doc.getElementById('canvas-viewport');
     Object.defineProperty(doc,'fullscreenElement',{configurable:true,value:doc.documentElement});doc.dispatchEvent(new win.Event('fullscreenchange'));
     const pinchTouch=(name,distance)=>{const points=[-1,1].map((direction,i)=>new win.Touch({identifier:i,target:stage,clientX:422+direction*distance,clientY:195}));return stage.dispatchEvent(new win.TouchEvent(name,{bubbles:true,cancelable:true,touches:name==='touchend'?[]:points,changedTouches:points}))};
     pinchTouch('touchstart',40);check(!pinchTouch('touchmove',80),'Fullscreen pinch is handled without relying on native browser zoom');pinchTouch('touchend',80);await ready(win);
     check(canvasViewport.classList.contains('magnified')&&Math.abs(stage.getBoundingClientRect().width-beforeZoom.width*2)<1,'Fullscreen pinch magnifies the slide');
     const scrollBefore=canvasViewport.scrollLeft;canvasViewport.scrollLeft+=30;
     check(canvasViewport.scrollLeft>scrollBefore&&canvasViewport.scrollHeight>canvasViewport.clientHeight,'Magnified fullscreen canvas has native horizontal and vertical pan space');
     touch('touchstart',250,200);check(touch('touchmove',130,200),'Fullscreen zoom leaves one-finger panning native');touch('touchend',30,200);
     check(win.location.hash==='#10','Panning a magnified fullscreen slide does not navigate');
     pinchTouch('touchstart',80);pinchTouch('touchmove',40);pinchTouch('touchend',40);await ready(win);
     check(!canvasViewport.classList.contains('magnified')&&Math.abs(stage.getBoundingClientRect().width-beforeZoom.width)<1,'Fullscreen pinch-out restores the fitted slide');
     pinchTouch('touchstart',0);pinchTouch('touchmove',80);pinchTouch('touchend',80);
     check(Math.abs(stage.getBoundingClientRect().width-beforeZoom.width)<1,'Overlapping pinch points cannot produce an invalid scale');
     pinchTouch('touchstart',40);pinchTouch('touchmove',400);pinchTouch('touchend',400);
     check(Math.abs(stage.getBoundingClientRect().width-beforeZoom.width*4)<1,'Fullscreen zoom is capped at 4x');
     doc.getElementById('next').click();check(!canvasViewport.classList.contains('magnified'),'Changing slides resets fullscreen magnification');doc.getElementById('prev').click();
     if(fullscreenDescriptor)Object.defineProperty(doc,'fullscreenElement',fullscreenDescriptor);else delete doc.fullscreenElement;
     doc.dispatchEvent(new win.Event('fullscreenchange'));
     frame.width=width;frame.height=height;await ready(win);
    check(win.getComputedStyle(stage).width===`${width}px`,'Rotating back restores portrait reading layout');
    frame.remove();
   }
   for(const [width,height] of [[667,375],[844,390],[932,430]]){
    const frame=await load(width,height),win=frame.contentWindow,doc=frame.contentDocument,controls=doc.getElementById('controls'),counter=doc.getElementById('slide-count');
    check(controls.hidden,'Landscape starts with controls hidden');
    check(win.getComputedStyle(doc.getElementById('portrait-hint')).display==='none','Landscape hides the orientation hint');
    const before=doc.getElementById('stage').getBoundingClientRect();
    counter.click();const after=doc.getElementById('stage').getBoundingClientRect();
    check(!controls.hidden&&Math.abs(before.width-after.width)<1&&Math.abs(before.height-after.height)<1,'Revealing landscape controls does not shrink the slide');
    for(let slide=1;slide<=13;slide++){
     if(slide>1)doc.getElementById('next').click();await ready(win);
     const stage=doc.getElementById('stage').getBoundingClientRect(),panel=doc.querySelector('.slide.active'),controls=doc.getElementById('controls').getBoundingClientRect();
     check(win.location.hash===`#${slide}`,`${width}px landscape: slide ${slide} navigation`);
     check(stage.left>=-1&&stage.right<=width+1&&stage.top>=-1&&stage.bottom<=height+1,`${width}px landscape: slide ${slide} fits viewport`);
     const scale=Math.min(width/1600,height/900);
     check(Math.abs(stage.width-1600*scale)<1&&Math.abs(stage.height-900*scale)<1,`${width}px landscape: slide ${slide} uses the maximum available space`);
     check(counter.textContent===`${slide}/13`,`${width}px landscape: slide ${slide} counter`);
     check(panel.scrollHeight<=panel.clientHeight+1&&panel.scrollWidth<=panel.clientWidth+1&&panel.scrollTop===0,`${width}px landscape: slide ${slide} needs no scrolling`);
    }
    const canvas=doc.getElementById('stage');
    for(const [side,value] of Object.entries({left:44,right:44,top:8,bottom:34}))canvas.style.setProperty(`--safe-${side}`,`${value}px`);
    win.dispatchEvent(new win.Event('resize'));await ready(win);
    const safe=canvas.getBoundingClientRect();
    check(safe.left>=44-1&&safe.right<=width-44+1&&safe.top>=8-1&&safe.bottom<=height-34+1,`${width}px landscape: canvas respects notch and home-indicator insets`);
    for(const side of ['left','right','top','bottom'])canvas.style.removeProperty(`--safe-${side}`);
    win.dispatchEvent(new win.Event('resize'));await ready(win);
    for(const button of doc.querySelectorAll('#controls button')){
     if(button.hidden)continue;const r=button.getBoundingClientRect();
     check(r.width>=44&&r.height>=44&&r.left>=0&&r.right<=width&&r.bottom<=height,`${width}px landscape: navigation tap target`);
    }
    doc.body.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Home',bubbles:true}));
    doc.body.dispatchEvent(new win.KeyboardEvent('keydown',{key:'PageDown',bubbles:true}));
    check(win.location.hash==='#2',`${width}px landscape: PageDown navigates rather than scrolling`);
    frame.remove();
   }
  for(const width of [1440,1920]){
   const frame=await load(width,width===1440?900:1080),win=frame.contentWindow,doc=frame.contentDocument;
   check(win.getComputedStyle(doc.getElementById('stage')).width==='1600px',`${width}px: desktop canvas preserved`);
   check(win.getComputedStyle(doc.getElementById('portrait-hint')).display==='none',`${width}px: desktop hides the orientation hint`);
   doc.body.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));
   check(win.location.hash==='#2',`${width}px: desktop keyboard navigation preserved`);
   frame.remove();
  }
 }catch(error){failures.push(error.stack||String(error))}
 results.className=failures.length?'fail':'pass';
 results.textContent=`${checks} checks; ${failures.length} failures.\n${failures.join('\n')}`;
 document.body.dataset.done='true';document.body.dataset.failures=failures.length;
};
const params=new URLSearchParams(location.search),width=Number(params.get('review'));
if(width){
 document.getElementById('run').hidden=true;results.textContent=`Visual review at ${width}px. Content is unchanged.`;
 const start=Number(params.get('start'))||1,end=Number(params.get('end'))||13;
 (async()=>{for(let slide=start;slide<=end;slide++){
  const card=document.createElement('section'),heading=document.createElement('h2');
  heading.textContent=`${width}px · slide ${slide}`;frames.append(card);card.append(heading);
   const frame=await load(width,width>=667&&width<=960?390:844,slide,card);
   if(width<=960&&frame.contentWindow.matchMedia('(orientation:portrait)').matches){
   const style=frame.contentDocument.createElement('style');style.textContent='.slide{scrollbar-gutter:stable}#controls{display:none}';frame.contentDocument.head.append(style);
   frame.height=frame.contentDocument.querySelector('.slide.active').scrollHeight;
   await ready(frame.contentWindow);
   frame.height=Math.max(Number(frame.height),frame.contentDocument.querySelector('.slide.active').scrollHeight);
  }
 }document.body.dataset.done='true'})();
}
if(params.has('run'))document.getElementById('run').click();
</script>
</html>
